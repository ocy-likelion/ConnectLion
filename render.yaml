services:
  - type: web
    name: connectlion-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
    autoDeploy: true

databases:
  - name: connectlion-db
    databaseName: connectlion
    user: connectlion
    plan: free
    ipAllowList: [] # 모든 IP에서 접근 가능하도록 설정 